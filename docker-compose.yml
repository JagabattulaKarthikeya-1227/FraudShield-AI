version: '3.8'

services:
  # -----------------------------------------
  # Nginx Reverse Proxy & Static File Server
  # -----------------------------------------
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # In production, we build the frontend image separately, but for local 
      # orchestration, we can mount a built dist folder or rely on the frontend container.
    depends_on:
      - backend
      - frontend
    networks:
      - fraudshield_net

  # -----------------------------------------
  # Frontend React App (Production Build)
  # -----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # We don't expose ports directly; Nginx handles routing
    networks:
      - fraudshield_net

  # -----------------------------------------
  # Backend Flask API (Gunicorn)
  # -----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://fraud_user:fraud_pass@mysql_db:3306/fraudshield
      - REDIS_URL=redis://redis_cache:6379/0
      - JWT_SECRET_KEY=production_secret_do_not_use_in_real_life
    depends_on:
      mysql_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    networks:
      - fraudshield_net

  # -----------------------------------------
  # Celery Background Worker
  # -----------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=mysql+pymysql://fraud_user:fraud_pass@mysql_db:3306/fraudshield
      - REDIS_URL=redis://redis_cache:6379/0
    depends_on:
      - redis_cache
      - mysql_db
    networks:
      - fraudshield_net

  # -----------------------------------------
  # MySQL Database
  # -----------------------------------------
  mysql_db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=fraudshield
      - MYSQL_USER=fraud_user
      - MYSQL_PASSWORD=fraud_pass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudshield_net

  # -----------------------------------------
  # Redis Broker & Cache
  # -----------------------------------------
  redis_cache:
    image: redis:7.2-alpine
    volumes:
      - redis_data:/data
    networks:
      - fraudshield_net

volumes:
  mysql_data:
  redis_data:

networks:
  fraudshield_net:
    driver: bridge
